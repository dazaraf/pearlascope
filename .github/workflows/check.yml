name: check
# Runs on pull requests in the context of the PR (never pull_request_target), with read-only permissions
# and no secrets. Nothing here deploys. Third-party actions are pinned to a full commit SHA.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Safety check (domains, addresses, secrets, SRI, CSP, syntax)
        run: node scripts/check.js
      - name: Data builder runs offline-safe
        run: node -e "require('./build-data.js'); console.log('build-data loads')"
